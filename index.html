    <script>
        (function () {
            function setupFormSubmit(form) {
                if (!form) return;
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }
                    var thanks = form.querySelector('.form-thanks');
                    var btn = form.querySelector('input[type="submit"]');
                    if (thanks) thanks.hidden = true;
                    var origLabel = btn ? btn.value : '';
                    if (btn) { btn.disabled = true; btn.value = 'Enviando…'; }
                    try {
                        var fd = new FormData(form);
                        var res = await fetch(form.action, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error('Submit failed');
                        form.reset();
                        if (thanks) thanks.hidden = false;
                    } catch (err) {
                        if (btn) { btn.disabled = false; btn.value = origLabel; }

        // Dynamic Rubro and Subrubro picklists from Salesforce
        (function() {
            var picklistData = null;
            
            // Define all Rubro and Subrubro select elements
            var rubroSelects = [
                { rubro: document.getElementById('00NOx00000g8LaB'), subrubro: document.getElementById('00NOx00000g8NdZ') },
                { rubro: document.getElementById('cat_00NOx00000g8LaB'), subrubro: document.getElementById('cat_00NOx00000g8NdZ') },
                { rubro: document.getElementById('dyn_00NOx00000g8LaB'), subrubro: document.getElementById('dyn_00NOx00000g8NdZ') }
            ];
            
            // Fetch picklist data from Salesforce
            async function fetchPicklists() {
                try {
                    // Use the same environment as API Leads tab if available, otherwise default to 'test'
                    var environment = 'test';
                    var envToggle = document.querySelector('input[name="api-environment"]:checked');
                    if (envToggle) {
                        environment = envToggle.value;
                    }
                    
                    var url = '/api/picklists?environment=' + environment;
                    
                    var response = await fetch(url);
                    
                    if (!response.ok) {
                        var errorText = await response.text();
                        console.error('Error response:', errorText);
                        throw new Error('Failed to fetch picklists: ' + response.status + ' ' + response.statusText);
                    }
                    
                    var contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        var text = await response.text();
                        throw new Error('Server returned non-JSON response');
                    }
                    
                    picklistData = await response.json();
                    
                    // Populate all forms
                    rubroSelects.forEach(function(selects) {
                        populateRubro(selects.rubro);
                        // Clear Subrubro dropdown (only show --Ninguno--)
                        populateSubrubro('', selects.subrubro);
                        setupRubroListener(selects.rubro, selects.subrubro);
                    });
                    
                } catch (error) {
                    console.error('Error fetching picklists:', error);
                    // Keep hardcoded values as fallback
                }
            }
            
            // Populate Rubro dropdown
            function populateRubro(rubroSelect) {
                if (!rubroSelect || !picklistData) return;
                
                // Clear existing options except the first one (--Ninguno--)
                while (rubroSelect.options.length > 1) {
                    rubroSelect.remove(1);
                }
                
                // Add options from Salesforce
                picklistData.controllingValues.forEach(function(item) {
                    var option = document.createElement('option');
                    option.value = item.value;
                    option.textContent = item.label;
                    rubroSelect.appendChild(option);
                });
            }
            
            // Populate Subrubro dropdown based on selected Rubro
            function populateSubrubro(rubroValue, subrubroSelect) {
                if (!subrubroSelect || !picklistData) return;
                
                // Clear existing options except the first one (--Ninguno--)
                while (subrubroSelect.options.length > 1) {
                    subrubroSelect.remove(1);
                }
                
                // Reset to no selection
                subrubroSelect.value = '';
                
                if (!rubroValue) return;
                
                // Get dependent values for this Rubro
                var dependentValues = picklistData.dependencies[rubroValue] || [];
                
                // Add options
                dependentValues.forEach(function(item) {
                    var option = document.createElement('option');
                    option.value = item.value;
                    option.textContent = item.label;
                    subrubroSelect.appendChild(option);
                });
            }
            
            // Setup change listener for Rubro to update Subrubro
            function setupRubroListener(rubroSelect, subrubroSelect) {
                if (!rubroSelect || !subrubroSelect) return;
                
                rubroSelect.addEventListener('change', function() {
                    populateSubrubro(rubroSelect.value, subrubroSelect);
                });
            }
            
            // Expose function to get random values (for lead generator)
            window.getRandomRubro = function() {
                if (!picklistData || !picklistData.controllingValues.length) {
                    return 'Rubro 1'; // Fallback
                }
                var random = picklistData.controllingValues[Math.floor(Math.random() * picklistData.controllingValues.length)];
                return random.value;
            };
            
            window.getRandomSubrubro = function(rubroValue) {
                if (!picklistData || !picklistData.dependencies[rubroValue]) {
                    return 'Subrubro 1'; // Fallback
                }
                var options = picklistData.dependencies[rubroValue];
                if (!options.length) return '';
                var random = options[Math.floor(Math.random() * options.length)];
                return random.value;
            };
            
            // Fetch on page load
            fetchPicklists();
        })();

                    generateSendBtn.disabled = false;
                    generateBtn.disabled = false;
                    generateSendBtn.textContent = 'Generar y Enviar';
                });
            }

            envRadios.forEach(function (radio) {
                radio.addEventListener('change', loadEndpoint);
            });

            modeRadios.forEach(function (radio) {
                radio.addEventListener('change', function() {
                    loadEndpoint();
                    updateJsonExample();
                    updateGeneratorVisibility();
                });
            });

            updateGeneratorVisibility();
            loadEndpoint();

            btn.addEventListener('click', async function () {
                var endpoint = endpointInput.value.trim();
                var jsonStr = jsonInput.value.trim();
                if (!endpoint) {
                    showApiResponse('Endpoint no configurado. Configure TEST_INSTANCE o PRODUCTION_INSTANCE en las variables de entorno.', 'error');
                    return;
                }
                var body;
                try {
                    body = jsonStr ? JSON.parse(jsonStr) : {};
                } catch (e) {
                    showApiResponse('JSON inválido: ' + e.message, 'error');
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Enviando…';
                responseEl.hidden = true;
                try {
                    var res = await fetch('/api/leads', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ endpoint: endpoint, body: body, environment: getEnvironment() })
                    });
                    var data = await res.json().catch(function () { return { message: res.statusText }; });
                    if (res.ok) {
                        showApiResponse('Lead enviado correctamente. ' + (data.id ? 'ID: ' + data.id : JSON.stringify(data)), 'success');
                    } else {
                        showApiResponse((data.message || data.error || JSON.stringify(data)) + ' (HTTP ' + res.status + ')', 'error');
                    }
                } catch (err) {
                    showApiResponse('Error de red: ' + err.message, 'error');
                }
                btn.disabled = false;
                btn.textContent = 'Enviar';
            });

            function showApiResponse(msg, type) {
                responseEl.textContent = msg;
                responseEl.className = 'api-response api-response--' + (type || 'info');
                responseEl.hidden = false;
            }
        })();
    </script>
</body>

</html>
