    <script>
        (function () {
            function setupFormSubmit(form) {
                if (!form) return;
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }
                    var thanks = form.querySelector('.form-thanks');
                    var btn = form.querySelector('input[type="submit"]');
                    if (thanks) thanks.hidden = true;
                    var origLabel = btn ? btn.value : '';
                    if (btn) { btn.disabled = true; btn.value = 'Enviando…'; }
                    try {
                        var fd = new FormData(form);
                        var res = await fetch(form.action, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error('Submit failed');
                        form.reset();
                        if (thanks) thanks.hidden = false;
                    } catch (err) {
                        if (btn) { btn.disabled = false; btn.value = origLabel; }
                        HTMLFormElement.prototype.submit.call(form);
                        return;
                    }
                    if (btn) { btn.disabled = false; btn.value = origLabel; }
                });
            }
            setupFormSubmit(document.getElementById('form-comercial'));
            setupFormSubmit(document.getElementById('form-cat'));
            setupFormSubmit(document.getElementById('form-dynamic'));
        })();

            var dynamicForm = document.getElementById('form-dynamic');
            
            if (!equipmentSelect || !modelSelect || !messageField || !dynamicForm) return;
            
            // Store original message before appending equipment info
            var originalMessage = '';
            
            // Show/hide model field based on equipment selection
            var modelWrapper = document.getElementById('dyn_model_wrapper');
            
            equipmentSelect.addEventListener('change', function () {
                if (equipmentSelect.value === 'Tractor agricola') {
                    modelWrapper.style.display = '';
                    modelSelect.required = true;
                } else {
                    modelWrapper.style.display = 'none';
                    modelSelect.required = false;
                    modelSelect.value = ''; // Reset model selection
                }
            });
            
            // Before form submission, append equipment/model to message field
            dynamicForm.addEventListener('submit', function (e) {
                var equipment = equipmentSelect.value;
                var model = modelSelect.value;
                
                // Store the original message (without equipment info)
                originalMessage = messageField.value.trim();
                
                // Build the appended info
                var appendText = '';
                if (equipment && equipment !== '') {
                    appendText += '\n\n--- Información de Equipo ---';
                    appendText += '\nEquipo: ' + equipment;
                    
                    if (model && model !== '') {
                        // Get the model option text (includes title attribute with power info)
                        var modelOption = modelSelect.options[modelSelect.selectedIndex];
                        appendText += '\nModelo: ' + model;
                        if (modelOption.title) {
                            appendText += ' (' + modelOption.title + ')';
                        }
                    }
                }
                
                // Append to message field (this will be sent to Salesforce along with the separate fields)
                if (appendText) {
                    messageField.value = originalMessage + appendText;
                }
            }, true); // Use capture phase to run before other submit handlers
            
            // After form reset, restore initial state
            dynamicForm.addEventListener('reset', function () {
                // Small delay to ensure reset completes first
                setTimeout(function () {
                    // Reset the message to empty (not the one with appended equipment info)
                    messageField.value = '';
                    
                    // Hide model field again
                    modelWrapper.style.display = 'none';
                    modelSelect.required = false;
                    
                    // Reset both selects to placeholder
                    equipmentSelect.selectedIndex = 0;
                    modelSelect.selectedIndex = 0;
                }, 10);
            });
        })();

        // copy and paste the switchTab function code from here
        function switchTab(tabName) {
            // copy and paste the Hide all tab contents code from here
            const contents = document.querySelectorAll(".tab-content");
            contents.forEach((content) => {
                content.classList.remove("active");
            });

            // copy and paste the Remove active class from all tabs code from here
            const tabs = document.querySelectorAll(".tab");
            tabs.forEach((tab) => {
                tab.classList.remove("active");
            });

            // copy and paste the Show selected tab content code from here
            document.getElementById(tabName).classList.add("active");

            // copy and paste the Add active class to clicked tab code from here
            event.target.classList.add("active");
        }

        // copy and paste the API Leads code from here
        (function () {
            var btn = document.getElementById('api-send-btn');
            var endpointInput = document.getElementById('api-endpoint');
            var jsonInput = document.getElementById('api-json');
            var responseEl = document.getElementById('api-response');
            var envRadios = document.querySelectorAll('input[name="api-env"]');
            if (!btn || !endpointInput || !jsonInput || !responseEl || !envRadios.length) return;

            function getEnvironment() {
                var checked = document.querySelector('input[name="api-env"]:checked');
                return checked ? checked.value : 'test';
            }

            function loadEndpoint() {
                var env = getEnvironment();
                fetch('/api/leads?environment=' + env)
                    .then(function (r) {
                        if (!r.ok) {
                            throw new Error('HTTP ' + r.status);
                        }
                        return r.json();
                    })
                    .then(function (data) {
                        if (data.suggestedLeadUrl) {
                            endpointInput.value = data.suggestedLeadUrl;
                            endpointInput.placeholder = data.suggestedLeadUrl;
                        } else {
                            endpointInput.value = '';
                            endpointInput.placeholder = 'No endpoint disponible. Configure TEST_INSTANCE o PRODUCTION_INSTANCE en env.';
                        }
                    })
                    .catch(function (err) {
                        endpointInput.value = '';
                        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                        if (isLocal) {
                            endpointInput.placeholder = 'API no disponible localmente. Ejecute "npm run dev".';
                        } else {
                            endpointInput.placeholder = 'Error al cargar endpoint. Verifique TEST_INSTANCE o PRODUCTION_INSTANCE en env.';
                        }
                        console.error('Error loading endpoint:', err);
                    });
            }

            envRadios.forEach(function (radio) {
                radio.addEventListener('change', loadEndpoint);
            });

            loadEndpoint();

            btn.addEventListener('click', async function () {
                var endpoint = endpointInput.value.trim();
                var jsonStr = jsonInput.value.trim();
                if (!endpoint) {
                    showApiResponse('Endpoint no configurado. Configure TEST_INSTANCE o PRODUCTION_INSTANCE en las variables de entorno.', 'error');
                    return;
                }
                var body;
                try {
                    body = jsonStr ? JSON.parse(jsonStr) : {};
                } catch (e) {
                    showApiResponse('JSON inválido: ' + e.message, 'error');
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Enviando…';
                responseEl.hidden = true;
                try {
                    var res = await fetch('/api/leads', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ endpoint: endpoint, body: body, environment: getEnvironment() })
                    });
                    var data = await res.json().catch(function () { return { message: res.statusText }; });
                    if (res.ok) {
                        showApiResponse('Lead enviado correctamente. ' + (data.id ? 'ID: ' + data.id : JSON.stringify(data)), 'success');
                    } else {
                        showApiResponse((data.message || data.error || JSON.stringify(data)) + ' (HTTP ' + res.status + ')', 'error');
                    }
                } catch (err) {
                    showApiResponse('Error de red: ' + err.message, 'error');
                }
                btn.disabled = false;
                btn.textContent = 'Enviar';
            });

            function showApiResponse(msg, type) {
                responseEl.textContent = msg;
                responseEl.className = 'api-response api-response--' + (type || 'info');
                responseEl.hidden = false;
            }
        })();
    </script>
</body>
